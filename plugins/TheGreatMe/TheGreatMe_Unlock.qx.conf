# Quantumult X Rewrite Configuration for TheGreatMe Premium Unlock
# RevenueCat Bypass — Place tgme_premium.js in /Scripts/ directory

[rewrite]
^https:\/\/api\.(revenuecat|rc-backup)\.com\/v1\/(subscribers\/|receipts|product_entitlement_mapping|offerings) url script-response-body tgme_premium.js
^https:\/\/api\.(revenuecat|rc-backup)\.com\/v1\/(subscribers\/|receipts) url script-request-header tgme_premium.js

[mitm]
hostname = api.revenuecat.com, api.rc-backup.com, api-paywalls.revenuecat.com, api-diagnostics.revenuecat.com
