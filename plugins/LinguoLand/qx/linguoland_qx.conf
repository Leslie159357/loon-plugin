// LinguoLand 会员解锁 — Quantumult X 配置
// =====================================================
// 使用方法:
// 1. 把 linguoland_nocache.js 和 linguoland_unlock.js 放到
//    Quantumult X → 脚本 → 本地脚本（或 iCloud 的 Scripts 目录）
// 2. 打开配置文件，把下面 [rewrite_local] 和 [mitm] 段合并进去
// 3. 开启 Quantumult X 的 MITM（设置 → MITM → 打开 + 证书信任）
// 4. 杀掉 LinguoLand 重新打开
// =====================================================

[rewrite_local]
^https?:\/\/api\.linguoland\.com\/api\/v1\/tts\/sentence url script-request-body linguoland_tts.js
^https?:\/\/api\.linguoland\.com\/api\/v1\/(auth\/quota-status|credits|auth\/profile) url script-request-header linguoland_nocache.js
^https?:\/\/api\.linguoland\.com\/api\/v1\/(auth\/quota-status|credits|auth\/profile) url script-response-body linguoland_unlock.js

[mitm]
hostname = api.linguoland.com

// =====================================================
// 效果:
//   tts/sentence → 本地算 sha1(text) 探测 CDN，命中直接返回音频 URL
//                  （服务器不收到请求 → TTS 听书不扣点数！）
//   quota-status → tier=MEMBER + 配额 999999999 + used 清零 + 会员 2099 Lifetime
//   credits → balance 999999999 + 插画免费 + freeQuota 放大
//   profile → tier=MEMBER 兜底
// 说明: 首次听的句子 CDN 无音频 → 放行服务器生成（首次扣费不可避免）
//       之后 CDN 永久缓存 → 永久免费。热门书句子大概率已被缓存。
// 判断生效看 app 界面（会员 2099 / 点数 999999999 / 听书不扣点），
// 不要看抓包（抓包导出的是改写前流量）。
