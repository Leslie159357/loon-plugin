# Quantumult X 配置 - Trakt VIP 解锁
# 伪造 apiz.trakt.tv /users/settings 响应 user.vip 字段
# 判定链: 服务器响应 → 本地 userSettingIsVIP → isVIP
# 使用: 复制到 [rewrite_local] + [mitm],或作为远程配置引用
# 脚本远程加载(jadelivr),无需本地建文件

[rewrite_local]
# 请求头: 防 gzip + 防 304(必须,否则响应脚本拿不到 body)
^https:\/\/(api|apiz)\.trakt\.tv\/users\/settings url script-request-header https://testingcf.jsdelivr.net/gh/Leslie159357/loon-plugin@main/plugins/Trakt/trakt_req.js

# ★ 核心: 用户资料响应伪造 (vip/vip_ep/vip_years/vip_cover_image → true/99)
^https:\/\/(api|apiz)\.trakt\.tv\/users\/settings url script-response-body https://testingcf.jsdelivr.net/gh/Leslie159357/loon-plugin@main/plugins/Trakt/trakt_vip.js

# 兜底: /users/me 及其他带 user 对象的端点
^https:\/\/(api|apiz)\.trakt\.tv\/users\/me($|\?) url script-response-body https://testingcf.jsdelivr.net/gh/Leslie159357/loon-plugin@main/plugins/Trakt/trakt_vip.js

[mitm]
hostname = api.trakt.tv, apiz.trakt.tv
