# DejaVocab Unlock - Quantumult X 配置版
# MITM 常开（配置驱动），无需开启抓包开关
# 使用方法：qx -> 配置文件 -> 编辑 -> 复制 [rewrite_local] 和 [mitm] 段
# 脚本需放在 qx 的 Scripts 目录，或改用远程 URL（见注释）

[rewrite_local]
# ★ 语法分析：请求转发到免费 AI 接口（http-request 阶段改 URL/body）
^https?:\/\/dejavocab\.(cn|com)\/api\/grammar-analysis\/ url script-request-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# ★ AI 转发响应：SSE 流 -> 语法分析 JSON
^https?:\/\/dejavocab\.(cn|com)\/api\/ai\/streaming\/deja\/ url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 订阅状态（核心 UI 解锁）
^https?:\/\/dejavocab\.(cn|com)\/api\/subscription\/status url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 配额
^https?:\/\/dejavocab\.(cn|com)\/(api\/)?quota url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 翻译/短语 quota_used 归零
^https?:\/\/dejavocab\.(cn|com)\/api\/(rolling-translation|rolling-phrase-extraction) url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 用户资料
^https?:\/\/dejavocab\.(cn|com)\/api\/user-profile url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 语感网络
^https?:\/\/dejavocab\.(cn|com)\/api\/colbert url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 短语
^https?:\/\/dejavocab\.(cn|com)\/api\/user-phrases url script-response-body https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

# 如果用远程脚本（推荐，自动更新），把上面 https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js 换成：
# https://raw.githubusercontent.com/Leslie159357/loon-plugin/main/plugins/DejaVocab/DejaVocab.js

[mitm]
hostname = dejavocab.cn, dejavocab.com
